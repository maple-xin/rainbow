<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rainbow Flight</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12243e;font-family:Arial,sans-serif}#scene{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}nav{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:6px;border-radius:25px;background:#08296345;backdrop-filter:blur(10px);border:1px solid #ffffff20;transition:opacity .6s}button{border:0;color:#e9f9ff;background:#ffffff12;border-radius:20px;min-height:38px;padding:0 15px;cursor:pointer;font:11px Arial,sans-serif;letter-spacing:.4px;touch-action:manipulation}button:hover,button:focus-visible{background:#ffffff35;outline:1px solid #c0ecff}#hint{position:absolute;bottom:82px;left:10%;right:10%;text-align:center;color:#d2edffc9;font-size:11px;letter-spacing:1px;pointer-events:none;transition:opacity 1s}#scene.quiet nav{opacity:.2}#scene.quiet nav:hover,#scene.quiet nav:focus-within{opacity:1}#scene.quiet #hint{opacity:0}@media(prefers-reduced-motion:reduce){#hint{transition:none}}@media(max-width:350px){button{padding:0 10px}}
</style></head><body><main id="scene"><canvas id="sky" aria-label="Rainbow birds with luminous trails. Drag to guide the flock. Tap to release a starburst."></canvas><div id="hint">DRAG TO GUIDE · TAP FOR STARLIGHT</div><nav aria-label="Flight controls"><button id="restart">Restart</button><button id="pause">Pause</button><button id="save">Save</button><button id="fullscreen" aria-label="Toggle fullscreen">Full view</button></nav></main><script>
'use strict';
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d',{alpha:false}),scene=document.getElementById('scene');let W=1,H=1,D=1,t=0,last=performance.now(),paused=false,active=null,target=null,quietAt=performance.now()+6000,bursts=0,seed=71903;const birds=[],sparks=[];
const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296},clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*f;
function hash(x,y){let n=Math.imul(x,374761393)+Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295}
function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(hash(ix,iy),hash(ix+1,iy),u),lerp(hash(ix,iy+1),hash(ix+1,iy+1),u),v)}
function fbm(x,y){let n=0,a=.55;for(let i=0;i<5;i++){n+=a*noise(x,y);x=x*2.03+13.7;y=y*2.03+4.3;a*=.5}return n}
const atmosphere=document.createElement('canvas');atmosphere.width=384;atmosphere.height=512;const ag=atmosphere.getContext('2d'),im=ag.createImageData(384,512);for(let y=0;y<512;y++)for(let x=0;x<384;x++){const nx=x/384,ny=y/512,grain=fbm(x*.015,y*.015),haze=Math.exp(-((nx-.93)**2/.55+(ny-.12)**2/.35)),upper=Math.exp(-ny*6.5);let k=(y*384+x)*4;im.data[k]=10+grain*12+haze*23+upper*19;im.data[k+1]=22+grain*24+haze*42+upper*75;im.data[k+2]=163+grain*72+haze*12+upper*9;im.data[k+3]=255}ag.putImageData(im,0,0);
const cloud=document.createElement('canvas');cloud.width=768;cloud.height=230;const cg=cloud.getContext('2d'),ci=cg.createImageData(768,230);for(let y=0;y<230;y++)for(let x=0;x<768;x++){let f=fbm(x*.035,y*.025),edge=45+50*noise(x*.008,1)+28*noise(x*.026,4),density=clamp((edge-y+f*100)/80,0,1),k=(y*768+x)*4;ci.data[k]=180+f*75;ci.data[k+1]=229+f*26;ci.data[k+2]=255;ci.data[k+3]=Math.round(density*density*250)}cg.putImageData(ci,0,0);
function resize(){const oldW=W,oldH=H;W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);for(const b of birds){b.x*=W/oldW;b.y*=H/oldH;b.trail.length=0}for(const s of sparks){s.x*=W/oldW;s.y*=H/oldH}if(target){target.x*=W/oldW;target.y*=H/oldH}}
function addBird(i,origin){const spread=i/Math.max(1,128),hue=(spread*315+5)%360;birds.push({id:i,x:origin.x+(rand()-.5)*12,y:origin.y+(rand()-.5)*12,vx:(rand()-.5)*40,vy:-25-rand()*30,hue,phase:rand()*Math.PI*2,size:.55+rand()*.65,depth:rand(),age:0,trail:[],launch:i*.07,wander:rand()*Math.PI*2})}
function burst(x,y,n=95){bursts++;for(let i=0;i<n;i++){const a=rand()*Math.PI*2,r=rand()*Math.min(W,H)*.045;sparks.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:Math.cos(a)*(10+rand()*95),vy:Math.sin(a)*(10+rand()*95)-18,life:1.2+rand()*2.4,max:3.6,size:.5+rand()*1.7,phase:rand()*7})}if(sparks.length>1000)sparks.splice(0,sparks.length-1000)}
function reset(){birds.length=0;sparks.length=0;t=0;seed=71903;bursts=0;active=null;target=null;paused=false;document.getElementById('pause').textContent='Pause';const origin={x:W*.5,y:H*.61};for(let i=0;i<128;i++)addBird(i,origin);burst(origin.x,origin.y,260);wake()}
function wake(){quietAt=performance.now()+5000;scene.classList.remove('quiet')}
function step(dt){t+=dt;const aspect=W/H,scale=Math.min(W,H)/650;for(const b of birds){b.age+=dt;if(b.age<b.launch)continue;const progress=clamp((b.age-b.launch)/5,0,1),fan=(b.id/127-.5),wave=Math.sin(t*.72+b.depth*3),centerX=target?target.x:W*(.50+.12*Math.sin(t*.27)),centerY=target?target.y:H*(.30+.09*Math.sin(t*.36));const widen=lerp(.035,.87,progress),tx=centerX+fan*W*widen+Math.sin(t*.87+b.phase)*W*.025,ty=centerY+H*(Math.abs(fan)*.19+Math.sin(b.id*2.39+t*.52)*.035)+(1-progress)*H*.31;let ax=(tx-b.x)*1.85+Math.sin(t*1.4+b.wander)*12*scale,ay=(ty-b.y)*1.3;const maxSpeed=H*.26;const damping=Math.exp(-dt*1.7);b.vx=b.vx*damping+ax*dt;b.vy=b.vy*damping+ay*dt;const speed=Math.hypot(b.vx,b.vy);if(speed>maxSpeed){b.vx*=maxSpeed/speed;b.vy*=maxSpeed/speed}b.x+=b.vx*dt;b.y+=b.vy*dt;for(const wake of b.trail){wake.y+=dt*H*.09;wake.x+=Math.sin(t*.8+b.phase)*dt*W*.004;}b.trail.push({x:b.x,y:b.y});if(b.trail.length>145)b.trail.shift();}
for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;if(s.life<=0){sparks.splice(i,1);continue}s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=Math.exp(-dt*.45);s.vy-=dt*3}if(t<9&&Math.random()<dt*13)burst(W*(.5+.02*Math.sin(t)),H*.61,6);}
function draw(){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(atmosphere,0,0,W,H);const wash=ctx.createRadialGradient(W*.6,H*.1,0,W*.6,H*.1,H*.8);wash.addColorStop(0,'#86e9fb23');wash.addColorStop(1,'#08159200');ctx.fillStyle=wash;ctx.fillRect(0,0,W,H);const drift=Math.sin(t*.085)*W*.035;ctx.drawImage(cloud,-W*.06+drift,-H*.055,W*1.15,H*.265);ctx.globalAlpha=.38;ctx.drawImage(cloud,-W*.10-drift,-H*.11,W*1.25,H*.34);ctx.globalAlpha=1;
const sizeScale=clamp(Math.min(W,H)/650,.55,1.4);ctx.globalCompositeOperation='screen';for(const b of birds){if(b.age<b.launch)continue;const tr=b.trail;if(tr.length>2){ctx.lineWidth=(.55+b.depth*.5)*sizeScale;const grad=ctx.createLinearGradient(tr[0].x,tr[0].y,b.x,b.y+.01);grad.addColorStop(0,`hsla(${b.hue},95%,65%,0)`);grad.addColorStop(.55,`hsla(${b.hue},100%,65%,.12)`);grad.addColorStop(1,`hsla(${b.hue},100%,72%,.6)`);ctx.strokeStyle=grad;ctx.beginPath();ctx.moveTo(tr[0].x,tr[0].y);for(let j=1;j<tr.length;j+=2)ctx.lineTo(tr[j].x,tr[j].y);ctx.lineTo(b.x,b.y);ctx.stroke();}
ctx.globalCompositeOperation='source-over';const wing=8.2*b.size*sizeScale,flap=Math.sin(t*5.2+b.phase),rise=flap*wing*.55,angle=clamp(b.vx/Math.max(35,Math.abs(b.vy)),-.7,.7)*.32;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(angle);ctx.strokeStyle=`hsla(${b.hue},100%,60%,.95)`;ctx.fillStyle=`hsla(${b.hue},100%,58%,.95)`;ctx.lineWidth=.8*sizeScale;ctx.shadowColor=`hsl(${b.hue},100%,65%)`;ctx.shadowBlur=5*sizeScale;ctx.beginPath();ctx.moveTo(-wing,2+rise);ctx.quadraticCurveTo(-wing*.48,-1+rise*.23,0,0);ctx.quadraticCurveTo(wing*.48,-1+rise*.23,wing,2+rise);ctx.quadraticCurveTo(wing*.40,1+rise*.42,0,1.5);ctx.quadraticCurveTo(-wing*.40,1+rise*.42,-wing,2+rise);ctx.fill();ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(-.65,3.3);ctx.lineTo(0,5);ctx.lineTo(.65,3.3);ctx.closePath();ctx.fill();ctx.restore();ctx.globalCompositeOperation='screen';}
ctx.shadowBlur=0;for(const s of sparks){const a=Math.min(1,s.life/.8),twinkle=.3+.7*Math.abs(Math.sin(t*4+s.phase));ctx.globalAlpha=a*twinkle;ctx.fillStyle='#e9ffff';const r=s.size*sizeScale;ctx.fillRect(s.x-r*.35,s.y-r*.35,r*.7,r*.7);if(s.size>1.7){ctx.beginPath();ctx.moveTo(s.x-r*2.3,s.y);ctx.lineTo(s.x+r*2.3,s.y);ctx.moveTo(s.x,s.y-r*2.3);ctx.lineTo(s.x,s.y+r*2.3);ctx.strokeStyle='#cefbff';ctx.lineWidth=.5;ctx.stroke()}}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
let down=null;canvas.addEventListener('pointerdown',e=>{wake();active=e.pointerId;down={x:e.clientX,y:e.clientY,time:performance.now()};target={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(active!==e.pointerId)return;target={x:e.clientX,y:e.clientY};wake()});canvas.addEventListener('pointerup',e=>{if(active!==e.pointerId)return;if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<12&&performance.now()-down.time<450)burst(e.clientX,e.clientY,140);active=null;down=null;target=null});function cancel(){active=null;down=null;target=null}canvas.addEventListener('pointercancel',cancel);canvas.addEventListener('lostpointercapture',cancel);window.addEventListener('blur',cancel);document.addEventListener('visibilitychange',()=>{cancel();last=performance.now()});
document.getElementById('restart').onclick=reset;document.getElementById('pause').onclick=()=>{paused=!paused;cancel();document.getElementById('pause').textContent=paused?'Resume':'Pause';wake()};document.getElementById('save').onclick=()=>{draw();const a=document.createElement('a');a.download='RAINBOW-FLIGHT.png';a.href=canvas.toDataURL('image/png');a.click();wake()};document.getElementById('fullscreen').onclick=()=>{wake();if(document.fullscreenElement)document.exitFullscreen?.();else scene.requestFullscreen?.().catch(()=>{})};window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('pause').click()}if(e.key.toLowerCase()==='r')reset()});window.addEventListener('resize',resize);
resize();reset();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.035,(now-last)/1000);last=now;if(!paused&&!document.hidden)step(dt);draw();if(now>quietAt&&!paused)scene.classList.add('quiet')}requestAnimationFrame(frame);if(location.search.includes('qa'))window.__flight={stats:()=>({time:t,birds:birds.filter(b=>b.age>=b.launch).length,total:birds.length,sparks:sparks.length,bursts,paused,active:active!==null,target:target?{...target}:null,width:W,height:H,centroid:birds.reduce((a,b)=>({x:a.x+b.x/128,y:a.y+b.y/128}),{x:0,y:0})})};
</script></body></html>
